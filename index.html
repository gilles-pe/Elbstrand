<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102e35">
  <meta name="description" content="Ein stiller Moment am Elbstrand. Eine animierte, malerische Küstenlandschaft mit Leuchtturm, Wellen und wanderndem Licht.">
  <title>Elbfeuer · Ein stiller Moment am Elbstrand</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="scene" class="scene" aria-label="Animierte Ölmalerei eines Leuchtturms am norddeutschen Elbstrand">
    <div class="world" aria-hidden="true">
      <img id="painting" class="painting" src="assets/elbstrand.webp" alt="" fetchpriority="high">
      <canvas id="water"></canvas>
    </div>
    <div class="shade" aria-hidden="true"></div>
    <canvas id="light" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <footer class="footer">
      <div class="controls" role="group" aria-label="Szenensteuerung">
        <div class="mood-control" role="group" aria-label="Lichtstimmung">
          <button class="mood active" data-mood="dusk" aria-pressed="true"><span class="mood-dot"></span>Abendlicht</button>
          <button class="mood" data-mood="night" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M12.8 10.4A5.6 5.6 0 0 1 5.6 3.2a5.6 5.6 0 1 0 7.2 7.2Z" stroke="currentColor" stroke-width="1.1"/></svg>Nacht</button>
        </div>
        <span class="control-divider"></span>
        <button id="sound" class="icon-button" aria-label="Wasserklang einschalten" aria-pressed="false" title="Wasserklang einschalten"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path class="sound-off" d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path class="sound-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button id="pause" class="icon-button" aria-label="Animation pausieren" aria-pressed="false" title="Animation pausieren"><svg class="pause-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6v12M15 6v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><svg class="play-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 9 6-9 6V6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      </div>
    </footer>

    <div id="loading" class="loading" role="status" aria-label="Die Szene wird geladen"><span class="loading-mark"></span></div>
    <span id="announcement" class="sr-only" aria-live="polite"></span>

  </main>
  <script src="scene.js"></script>
</body>
</html>
